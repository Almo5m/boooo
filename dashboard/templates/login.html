<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(1000px 600px at 80% -10%, rgba(109,94,252,0.25), transparent 60%),
      radial-gradient(800px 500px at 0% 110%, rgba(52,209,165,0.15), transparent 55%),
      #0b0e17;
    color: #eef0f6;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .box {
    background: #151a29;
    border: 1px solid #262d42;
    padding: 40px 34px;
    border-radius: 18px;
    width: 340px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.7);
  }
  .logo {
    width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #6d5efc, #34d1a5);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  h2 { text-align: center; margin: 0 0 4px; font-size: 18px; font-weight: 800; color: #fff; }
  p.sub { text-align: center; color: #93a0bd; font-size: 13px; margin: 0 0 26px; }
  label { font-size: 12.5px; color: #93a0bd; font-weight: 600; display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 16px;
    border-radius: 10px; border: 1px solid #262d42;
    background: #0b0e17; color: #fff; font-family: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: #6d5efc; box-shadow: 0 0 0 3px rgba(109,94,252,0.2); }
  button {
    width: 100%; padding: 12px; font-weight: 700; font-size: 14.5px;
    background: linear-gradient(135deg, #6d5efc, #8f7dff);
    color: #fff; border: none; border-radius: 10px; margin-top: 6px; cursor: pointer;
    box-shadow: 0 10px 24px -10px rgba(109,94,252,0.7);
  }
  .error { color: #ff5c72; text-align: center; font-size: 13px; margin-bottom: 14px; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🎓</div>
  <h2>لوحة تحكم البوت</h2>
  <p class="sub">سجّل دخولك عشان تدير المواد والاختبارات والجدولة</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>اسم المستخدم</label>
    <input type="text" name="username" required autofocus>
    <label>كلمة السر</label>
    <input type="password" name="password" required>
    <button type="submit">دخول →</button>
  </form>
</div>
</body>
</html>
