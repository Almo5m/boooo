{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>⚙️ إعدادات الجروبات</h1>
  <p>الجروب بيتسجل هنا تلقائي أول ما البوت يستخدم فيه أي أمر</p>
</div>

{% for g in groups %}
<div class="card">
  <h3>جروب: <span style="color:var(--text-dim); font-weight:400;">{{ g.chat_id }}</span></h3>
  <form method="post" action="/settings/update/{{ g.chat_id }}">
    <label>رسالة الترحيب (استخدم {name})</label>
    <textarea name="welcome_text" rows="2">{{ g.welcome_text }}</textarea>

    <label>القوانين</label>
    <textarea name="rules_text" rows="3">{{ g.rules_text }}</textarea>

    <label>عدد التحذيرات قبل الحظر التلقائي</label>
    <input type="number" name="max_warnings" value="{{ g.max_warnings }}" min="1" max="10">

    <button type="submit">💾 حفظ الإعدادات</button>
  </form>
</div>
{% else %}
<div class="card" style="color:var(--text-dim);">لسه مفيش جروبات مسجلة. شغّل البوت في الجروب وابعت أي أمر عشان يتسجل هنا.</div>
{% endfor %}
{% endblock %}
